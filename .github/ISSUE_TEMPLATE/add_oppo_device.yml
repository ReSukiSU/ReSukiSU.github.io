name: Contribute to Unofficially Supported Oppo Device
description: Add your device kernel source to ReSukiSU's Unofficially Supported Oppo Device List,Use this template also add device to unofficially supported device list
title: "[Add Oppo Device]: "
labels: ["add-oppo-device"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for supporting ReSukiSU!
  - type: input
    id: repo-url
    attributes:
      label: Repository URL
      description: Your repository URL
      placeholder: https://github.com/ReSukiSU/ReSukiSU
    validations:
      required: true
  - type: input
    id: device
    attributes:
      label: Device
      description: Please describe the device maintained by you.
      placeholder: Oppo Device
    validations:
      required: true
  - type: checkboxes
    id: terms
    attributes:
      label: Code of Conduct
      description: By submitting this issue, you should be the maintainer of the repository.
      options:
        - label: I'm the maintainer of this repository
          required: true
